<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Treasure Hunt</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; margin: 0; }
    header { background: #fff; padding: 20px; text-align: center; border-bottom: 3px solid #000; }
    nav a { margin: 0 10px; text-decoration: none; color: #000; font-weight: bold; }
    .section { padding: 40px; text-align: center; }
    .map { width: 300px; height: 300px; background: sandybrown; margin: 20px auto; border-radius: 10px; position: relative; }
    .spot { width: 60px; height: 60px; background: rgba(255,255,255,0.8); border-radius: 10px; position: absolute; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1>Treasure Hunt</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="trivia.html">Trivia</a>
    <a href="props.html">Props</a>
    <a href="fan-zone.html">Fan Zone</a>
  </nav>
</header>

<div class="section">
  <h2>Find the hidden treasure!</h2>

  <div class="map">
    <div class="spot" style="top:20px; left:40px;" onclick="found('Nope! Just sand.')">X</div>
    <div class="spot" style="top:120px; left:200px;" onclick="found('A clue! Keep going!')">X</div>
    <div class="spot" style="top:200px; left:80px;" onclick="found('YOU FOUND THE TREASURE! 🏆')">X</div>
  </div>

  <h2 id="result"></h2>
</div>

<script>
function found(msg) {
  document.getElementById('result').innerHTML = msg;
}
</script>

</body>
</html>
