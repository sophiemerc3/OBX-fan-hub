<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Which Pogue Are You?</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f2f2f2; }
    header { background: #fff; padding: 20px; text-align: center; border-bottom: 3px solid #000; }
    nav a { margin: 0 10px; text-decoration: none; color: #000; font-weight: bold; }
    .section { padding: 40px; text-align: center; }
    .question {
      background: #fff;
      padding: 20px;
      margin: 20px auto;
      width: 70%;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    button {
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body>

<header>
  <h1>Which Pogue Are You?</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="trivia.html">Trivia</a>
    <a href="props.html">Props</a>
    <a href="fan-zone.html">Fan Zone</a>
  </nav>
</header>

<div class="section">
  <h2>Answer the questions to find out!</h2>

  <div class="question">
    <strong>Q1:</strong> What’s your vibe?<br><br>
    <button onclick="result('JJ')">Chaotic & loyal</button>
    <button onclick="result('John B')">Adventurous & brave</button>
    <button onclick="result('Kiara')">Earthy & caring</button>
    <button onclick="result('Pope')">Smart & determined</button>
  </div>

  <div class="question">
    <strong>Q2:</strong> Pick a place:<br><br>
    <button onclick="result('JJ')">The Chateau</button>
    <button onclick="result('Kiara')">The beach</button>
    <button onclick="result('Pope')">Library</button>
    <button onclick="result('John B')">Boat dock</button>
  </div>

  <div class="question">
    <strong>Q3:</strong> Choose a treasure:<br><br>
    <button onclick="result('John B')">Royal Merchant gold</button>
    <button onclick="result('JJ')">A gun (lol)</button>
    <button onclick="result('Kiara')">A seashell</button>
    <button onclick="result('Pope')">A clue</button>
  </div>

  <h2 id="output"></h2>
</div>

<script>
function result(name) {
  document.getElementById("output").innerHTML = "You are " + name + "!";
}
</script>

</body>
</html>
